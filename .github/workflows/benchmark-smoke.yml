name: NHL benchmark smoke tests
on:
  push:
    branches:
      - research/nhl-model-benchmarks
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
