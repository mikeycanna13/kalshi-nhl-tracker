name: Collect Kalshi NHL snapshots
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kalshi-nhl-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public NHL market snapshots
        run: python collector.py
      - name: Commit database if changed
        if: always()
        shell: bash
        run: |
          if [ ! -f data/kalshi.sqlite ]; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi.sqlite
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: NHL market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
