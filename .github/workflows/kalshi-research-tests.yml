name: Kalshi research collector unit tests
on:
  push:
    branches: [research/nhl-model-benchmarks]
    paths:
      - research_kalshi_probability_join.py
      - test_research_kalshi_probability_join.py
      - research_kalshi_ev.py
      - research_kalshi_contract_match.py
      - test_research_kalshi_contract_match.py test_research_kalshi_probability_join.py
      - research_kalshi_snapshots.py
      - test_research_kalshi_snapshots.py
      - .github/workflows/kalshi-research-tests.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_research_kalshi_snapshots.py test_research_kalshi_contract_match.py
