name: NHL sportsbook market benchmark unit tests
on:
  push:
    branches: [research/nhl-model-benchmarks]
    paths:
      - research_market_benchmark.py
      - test_research_market_benchmark.py
      - .github/workflows/market-benchmark-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate point-in-time and de-vig calculations on synthetic fixture
        run: python -m unittest -v test_research_market_benchmark.py
