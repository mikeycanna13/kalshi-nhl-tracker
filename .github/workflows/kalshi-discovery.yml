name: Kalshi NHL public API discovery
on:
  push:
    branches: [research/nhl-model-benchmarks]
    paths:
      - research_kalshi_discover.py
      - .github/workflows/kalshi-discovery.yml
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python research_kalshi_discover.py --max-pages 60
