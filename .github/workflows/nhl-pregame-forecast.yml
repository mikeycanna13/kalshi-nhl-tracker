name: NHL research pregame forecasts
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'NHL schedule date (YYYY-MM-DD); defaults to next UTC day'
        required: false
        type: string
      collect_sportsbook:
        description: 'OPT-IN: use configured THE_ODDS_API_KEY quota to fetch live sportsbook quotes'
        required: false
        default: false
        type: boolean
  push:
    branches: [research/nhl-model-benchmarks]
    paths:
      - research_nhl_pregame_forecast.py
      - research_asof_audit.py
      - research_market_benchmark.py
      - research_sportsbook_capture.py
      - nhl_mvp.py
      - 'research_kalshi_*.py'
      - .github/workflows/nhl-pregame-forecast.yml
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore historical NHL schedule cache
        uses: actions/cache/restore@v4
        with:
          path: data/nhl_schedule_cache
          key: nhl-schedule-cache-v1-${{ github.run_id }}
          restore-keys: |
            nhl-schedule-cache-v1-

      - name: Download completed NHL historical games
        run: python nhl_mvp.py --seasons 20212022 20222023 20232024 20242025 20252026 20262027
      - name: Build strictly pregame research forecasts
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -z "$TARGET_DATE" ]; then TARGET_DATE=$(date -u -d '+1 day' +%F); fi
          python research_nhl_pregame_forecast.py --date "$TARGET_DATE"
      - name: Optional live sportsbook snapshot (workflow_dispatch only; consumes provider quota)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.collect_sportsbook == true }}
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python research_sportsbook_capture.py --enable
      - name: Explicitly record absent sportsbook data without network use
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.collect_sportsbook != true }}
        run: python research_sportsbook_capture.py
      - name: Capture and rank live Kalshi research quotes
        run: python research_kalshi_paper.py capture results/pregame_forecasts.json results/paper_capture.json
      - name: Benchmark model versus time-matched sportsbook consensus, if available
        run: python research_market_benchmark.py --capture results/paper_capture.json --odds-snapshot results/sportsbook_snapshot.json
      - name: Audit forecast provenance and pregame quote timestamps
        run: python research_asof_audit.py results/paper_capture.json
      - name: Generate auditable candidate rankings
        run: python research_kalshi_report.py results/paper_capture.json
      - name: Save partial NHL schedule cache even on failed run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/nhl_schedule_cache
          key: nhl-schedule-cache-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-pregame-research-forecasts
          path: |
            results/pregame_forecasts.json
            results/paper_capture.json
            results/paper_report.csv
            results/paper_report.md
            results/asof_audit.json
            results/sportsbook_snapshot.json
            results/sportsbook_benchmark.json
          if-no-files-found: ignore
          retention-days: 90
