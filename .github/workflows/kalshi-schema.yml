name: Inspect Kalshi NHL contract metadata
on:
  push:
    branches: [research/nhl-model-benchmarks]
    paths:
      - research_kalshi_market_schema.py
      - .github/workflows/kalshi-schema.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python research_kalshi_market_schema.py
